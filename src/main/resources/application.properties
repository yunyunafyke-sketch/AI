spring.application.name=AI


# \u4F7F\u7528\u73AF\u5883\u53D8\u91CF\u4FDD\u5B58\u771F\u5B9E API Key\uFF0C\u4E0D\u8981\u628A\u5BC6\u94A5\u76F4\u63A5\u63D0\u4EA4\u5230 Git
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.base-url=https://api.deepseek.com
# \u6307\u5B9A\u5177\u4F53\u4F7F\u7528\u7684\u6A21\u578B\uFF0C\u66FF\u6362\u6210\u8D26\u53F7\u6216\u6A21\u578B\u670D\u52A1\u652F\u6301\u7684\u540D\u79F0
spring.ai.openai.chat.model=deepseek-v4-flash

#\u8BBE\u7F6E\u9879\u76EE HTTP \u8BF7\u6C42\u548C\u54CD\u5E94\u9ED8\u8BA4\u4F7F\u7528 UTF-8 \u7F16\u7801\u3002
#UTF-8 \u5C31\u662F\u4E2D\u6587\u3001\u82F1\u6587\u3001Emoji \u90FD\u80FD\u6B63\u786E\u8868\u793A\u7684\u7F16\u7801\u65B9\u5F0F\u3002
spring.servlet.encoding.charset=UTF-8
#\u5F3A\u5236\u6240\u6709 HTTP \u54CD\u5E94\u4F7F\u7528\u4E0A\u9762\u914D\u7F6E\u7684 UTF-8\u3002
#\u4F60\u7684 SSE \u63A5\u53E3\u539F\u672C\u54CD\u5E94\u5934\u53EA\u6709
#Content-Type: text/event-stream
spring.servlet.encoding.force-response=true

# Redis Stack \u8FDE\u63A5
spring.ai.chat.memory.repository.redis.host=localhost
spring.ai.chat.memory.repository.redis.port=6379
# spring.ai.chat.memory.repository.redis.password=${REDIS_PASSWORD}

# \u4F1A\u8BDD\u8BB0\u5FC6\u7684 Redis \u5B58\u50A8\u7B56\u7565
spring.ai.chat.memory.repository.redis.key-prefix=chat-memory:
spring.ai.chat.memory.repository.redis.time-to-live=24h
spring.ai.chat.memory.repository.redis.initialize-schema=true

#400	\u8BF7\u6C42\u53C2\u6570\u6216\u683C\u5F0F\u9519\u8BEF	\u4E0D\u91CD\u8BD5
#401	API Key \u9519\u8BEF\u6216\u6CA1\u6709\u8BA4\u8BC1	\u4E0D\u91CD\u8BD5
#403	\u6CA1\u6709\u6743\u9650\u8BBF\u95EE	\u4E0D\u91CD\u8BD5
#429	\u8BF7\u6C42\u592A\u9891\u7E41\u6216\u989D\u5EA6\u53D7\u9650	\u91CD\u8BD5
#500	AI \u670D\u52A1\u5185\u90E8\u5F02\u5E38	\u91CD\u8BD5
#502	\u7F51\u5173\u4ECE\u4E0A\u6E38\u62FF\u5230\u4E86\u9519\u8BEF\u54CD\u5E94	\u91CD\u8BD5
#503	AI \u670D\u52A1\u6682\u65F6\u4E0D\u53EF\u7528	\u91CD\u8BD5
#504	\u7F51\u5173\u7B49\u5F85 AI \u670D\u52A1\u8D85\u65F6	\u91CD\u8BD5

#\u65B9\u6CD5\u91CC\u7684 429 \u662F\u201C\u6211\u9650\u5236\u6211\u7684\u7528\u6237\u201D\uFF0C\u914D\u7F6E\u91CC\u7684 429 \u662F\u201CAI \u670D\u52A1\u9650\u5236\u6211\u4E4B\u540E\uFF0C\u6211\u8981\u4E0D\u8981\u91CD\u8BD5\u201D\u3002

#\u4F60\u7684\u540E\u7AEF\u5411 AI \u53D1\u8BF7\u6C42
#        \u2193
#AI \u5224\u65AD\u5F53\u524D\u8BF7\u6C42\u8FC7\u591A
#        \u2193
#AI \u8FD4\u56DE HTTP 429
#        \u2193
#OpenAI Java SDK \u8BC6\u522B\u5230 429
#        \u2193
#\u6839\u636E\u914D\u7F6E\u51B3\u5B9A\u662F\u5426\u81EA\u52A8\u91CD\u8BD5
#        \u2193
#\u4ECD\u7136\u5931\u8D25\uFF0C\u624D\u8FDB\u5165 subscribe() \u7684 error \u56DE\u8C03


# \u6700\u591A\u5C1D\u8BD5 3 \u6B21\uFF1B\u4EC5\u5BF9\u660E\u786E\u5217\u51FA\u7684\u6682\u65F6\u6027\u72B6\u6001\u7801\u91CD\u8BD5
spring.ai.retry.max-attempts=3
# \u7B2C\u4E00\u6B21\u91CD\u8BD5\u524D\u7B49\u5F85 1 \u79D2\uFF0C\u540E\u7EED\u7B49\u5F85\u65F6\u95F4\u6309 2 \u500D\u589E\u957F\uFF0C\u6700\u957F\u4E0D\u8D85\u8FC7 4 \u79D2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=4s
# 4xx \u9ED8\u8BA4\u4E0D\u91CD\u8BD5\uFF0C\u4E0B\u9762\u53EA\u5355\u72EC\u653E\u884C 429
spring.ai.retry.on-client-errors=false
# \u6A21\u578B\u9650\u989D\u6216\u670D\u52A1\u7AEF\u6682\u65F6\u6545\u969C\uFF0C\u624D\u5141\u8BB8\u91CD\u8BD5
spring.ai.retry.on-http-codes=429,500,502,503,504
# \u8BF7\u6C42\u53C2\u6570\u3001\u8BA4\u8BC1\u6216\u6743\u9650\u9519\u8BEF\u5FC5\u987B\u76F4\u63A5\u66B4\u9732\uFF0C\u4E0D\u80FD\u9760\u91CD\u8BD5\u63A9\u76D6
spring.ai.retry.exclude-on-http-codes=400,401,403
